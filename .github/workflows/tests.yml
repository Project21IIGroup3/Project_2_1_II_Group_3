name: Tests

on:
  push:
  workflow_dispatch:

jobs:
  math-tests:
    name: Math function tests
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Check out the code
        uses: actions/checkout@v5


      #The math tests only use the standard library, so mediapipe/opencv are
      #deliberately NOT installed here, that keeps every push fast.
      - name: Run the math tests
        run: python3 -m unittest discover -s FaceTracking -p "test_*.py" -v
