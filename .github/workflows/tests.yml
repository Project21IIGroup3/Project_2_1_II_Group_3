name: Tests

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    name: Full test suite
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      #Tools are installed once on the runner machine with scripts/setup-runner.sh; this just fails fast with a pointer to that script if something is missing.
      - name: Check runner setup
        run: |
          missing=""
          for cmd in python3 pnpm cargo pkg-config curl; do
            command -v "$cmd" >/dev/null 2>&1 || missing="$missing $cmd"
          done
          python3 -c "import importlib.util, sys; sys.exit(0 if all(importlib.util.find_spec(p) for p in ('mediapipe', 'cv2', 'websockets')) else 1)" || missing="$missing python-packages"
          pkg-config --exists javascriptcoregtk-4.1 || missing="$missing webkitgtk-devel"
          if [ -n "$missing" ]; then
            echo "Missing on the runner:$missing"
            echo "Run scripts/setup-runner.sh once on the runner machine."
            exit 1
          fi
          echo "Runner setup OK"

      - name: Run Python tests (math, tracker, bridge)
        run: python3 -m unittest discover -s FaceTracking -p "test_*.py" -v

      - name: Install GUI dependencies
        working-directory: GUI
        run: pnpm install

      - name: Run frontend tests
        working-directory: GUI
        run: pnpm test

      - name: Type-check the GUI
        working-directory: GUI
        run: pnpm check

      #The tauri build script embeds frontendDist at compile time, so an index.html must exist there even for cargo test. build/ is gitignored.
      - name: Prepare frontend dist stub
        run: |
          mkdir -p GUI/build
          printf '<!doctype html><html><body></body></html>\n' > GUI/build/index.html

      #CARGO_TARGET_DIR lives in $HOME because actions/checkout git-cleans the workspace (including target/) on every run, which would force a full rebuild each commit.
      - name: Run Rust tests (shell spawns the bridge)
        working-directory: GUI/src-tauri
        run: |
          export CARGO_TARGET_DIR="$HOME/.cargo-target"
          cargo test

      #Do Data Collection later
