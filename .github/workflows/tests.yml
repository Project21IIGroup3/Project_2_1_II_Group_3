name: Tests

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    name: Full test suite
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      #Face.py imports mediapipe/cv2 lazily (camera mode only), so the tests only need websockets; everything is pinned in requirements.txt so the full stack is ready for data collection. The runner's python3 may have no pip, so bootstrap it with get-pip.py, then install into the user site.
      - name: Install Python dependencies
        run: |
          python3 -m pip --version 2>/dev/null || curl -sS https://bootstrap.pypa.io/get-pip.py | python3 - --user
          python3 -m pip install --user -r FaceTracking/requirements.txt || python3 -m pip install --user --break-system-packages -r FaceTracking/requirements.txt

      - name: Run Python tests (math, tracker, bridge)
        run: python3 -m unittest discover -s FaceTracking -p "test_*.py" -v

      - name: Install pnpm
        run: |
          mkdir -p "$HOME/bin"
          if [ ! -x "$HOME/bin/pnpm" ]; then
            curl -fsSL https://github.com/pnpm/pnpm/releases/download/v12.10.1/pnpm-linux-x64.tar.gz -o "$HOME/bin/pnpm.tar.gz"
            tar -xzf "$HOME/bin/pnpm.tar.gz" -C "$HOME/bin"
            rm "$HOME/bin/pnpm.tar.gz"
          fi
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install GUI dependencies
        working-directory: GUI
        run: pnpm install

      - name: Run frontend tests
        working-directory: GUI
        run: pnpm test

      - name: Type-check the GUI
        working-directory: GUI
        run: pnpm check

      #The tauri build script embeds frontendDist at compile time, so an index.html must exist there even for cargo test. build/ is gitignored.
      - name: Prepare frontend dist stub
        run: |
          mkdir -p GUI/build
          printf '<!doctype html><html><body></body></html>\n' > GUI/build/index.html

      - name: Run Rust tests (shell spawns the bridge)
        working-directory: GUI/src-tauri
        run: cargo test

      #Do Data Collection later
